<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งค่าระบบ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
  <div class="container" style="max-width: 500px;">
    <a href="index.html" class="btn btn-secondary mb-3">&larr; กลับหน้าหลัก</a>
    <div class="card shadow-sm">
      <div class="card-body">
        <h5>เปลี่ยนรหัสผ่าน</h5>
        <form id="changePasswordForm">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" id="settingUser" class="form-control" readonly>
          </div>
          <div class="mb-3">
            <label class="form-label">รหัสผ่านใหม่</label>
            <input type="password" id="newPassword" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-success w-100">บันทึกรหัสผ่านใหม่</button>
        </form>
      </div>
    </div>
  </div>

  <script src="db.js"></script>
  <script>
    const currentUser = sessionStorage.getItem("loggedInUser");
    if (!currentUser) window.location.href = "login.html";
    document.getElementById("settingUser").value = currentUser;

    document.getElementById("changePasswordForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      await dbEngine.init();
      const users = await dbEngine.getAll("users");
      const userObj = users.find(u => u.username === currentUser);
      
      if (userObj) {
        userObj.password = document.getElementById("newPassword").value;
        await dbEngine.update("users", userObj);
        alert("อัปเดตรหัสผ่านเรียบร้อยแล้ว");
      }
    });
  </script>
</body>
</html>
