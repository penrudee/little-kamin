<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>

<body class="bg-light">
  <div class="container my-4" stype="max-width: 600px;">
    <div class="card shadow-sm mb-3">
      <div class="card-header bg-primary text-white text-center fw-bold fs-5">
        The Writer / งานเขียน / จดบันทึก
      </div>
      <div class="card-body">
        <div id="connectionStatus" class="alert alert-warning text-center py-2 mb-3">
          กำลังเชื่อมต่อไปยังฐานข้อมูลของร้าน...
        </div>
        <!-- writting area  -->
        <style>
          #writeAreaId {
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 500px;
            margin: 20px auto;
          }

          #write-area {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            color: #2c3e50;
            background-color: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
            resize: vertical;
            min-height: 120px;
            max-height: 400px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
          }

          #write-area:hover {
            border-color: #94a3b8;

          }

          #write-area:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15)
          }

          #write-area:placeholder {
            color: #94a3b8;
            opacity: 1;
          }
        </style>
        <div class="writeArea" id="writeAreaId">
          <label for="topic-area">หัวข้อ</label>
          <input type="text" class="form-control form-control-lg" placeholder="Topic">
          <textarea name="write-area" id="write-area" cols="30" rows="10" placeholder="เนื้อหา">
          </textarea>
          <br>
          <button onclick="wrapText('**','**')">Bold</button>
          <button onclick="wrapText('*','*')">Italic</button>
          <button onclick="insertText('[Link Text](url)')">Insert Link</button>
          <script>
            function wrapText(startTag, endTag){
              const textarea = document.getElementById('write-area');
              const start = textarea.selectionStart;
              const end = textarea.selectionEnd; 
              const text = textarea.value;
              // get selected text
              const selectedText = text.substring(start, end);
              // replace the selected text with formatted text 
              const formattedText = startTag + selectedText + endTag;
              textarea.value = text.substring(0, start) + formattedText + text.substring(end);
              // Reposition the cursor 
              textarea.selectionStart = start; 
              textarea.selectionEnd = start + formattedText.length;
              // Focus back to the textarea 
              textarea.focus();
            }
            // function to insert text at the cursor position
            function insertText(textToInsert){
              const textarea = document.getElementById('write-area');
              const start = textarea.selectionStart; 
              const end = textarea.selectionEnd;
              const text = textarea.value;

              // insert the text at the cursor position
              textarea.value = text.substring(0, start) + textToInsert + text.substring(end);
              // update cursor position
              textarea.selectionStart = textarea.selectionEnd = start + textToInsert.length;
              // focus back on the textarea 
              textarea.focus();
            }
          </script>
        </div>
      </div>
    </div>
  </div>

  <script>
    let peer = null;
    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const hostId = urlParams.get("hostId")
      const patientId = urlParams.get("patientId");
      if (!host || !patientId) {
        document.getElementById("connectionStatus").className = "alert alert-danger text-center py-2";
        document.getElementById("connectionStatus").innerText = "❌ QR Code ไม่ถูกต้อง หรือข้อมูลไม่ครบถ้วน";
        return;
      }
      // เริ่มต้นเชื่อมต่อ WebRTC
      connectToHostStore(hostId, patientId);
    };
    function connectToHostStore(hostId, patientId) {
      peer = new Peer({
        config: {
          iceServers: [
            {urls: "stun:stun.l.google.com:19302"},
            {urls: "stun:stun1.l.google.com:19302"},
            {urls: "stun:stun2.l.google.com:19302"}
          ]
        }
      });

      peer.on("open", () => {
        const conn = peer.connect(hostId, {reliable: true});

        conn.on("open", () => {
          document.getElementById("connectionStatus").className = "alert alert-info text-center py-2";
          document.getElementById("connectionStatus").innerText = "🔄 เชื่อมต่อร้านยาสำเร็จ กำลังดึงประวัติยา...";

          // ส่งคำขอขอดึงข้อมูลประวัติเฉพาะคนไข้รายนี้
          conn.send({
            type: "REQUEST_PATIENT_HISTORY",
            patientSpecialId: patientId
          });
        });

        conn.on("data", (data) => {
          if (data.type === "RESPONSE_PATIENT_HISTORY") {
            renderPatientData(data.payload);
          }
        });

        conn.on("close", () => {
          console.log("Connection closed");
        });

        conn.on("error", (err) => {
          showError("ไม่สามารถดึงข้อมูลได้ เครื่องร้านยาอาจปิดอยู่");
        });
      });

      peer.on("error", (err) => {
        showError("การเชื่อมต่อ P2P ขัดข้อง กรุณาลองสแกนใหม่อีกครั้ง");
      });
    }

  </script>
</body>

</html>
