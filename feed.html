<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pharmacy Feed - zybook.kaminpos.xyz</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Sarabun', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- Navigation Bar -->
  <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-full bg-blue-600/20 text-blue-400 flex items-center justify-center border border-blue-500/30">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
          </svg>
        </div>
        <h1 class="font-bold text-lg text-white tracking-wide">Pharmacy Feed</h1>
      </div>

      <div class="flex items-center space-x-3 text-xs">
        <div class="flex items-center space-x-1.5 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
          <span id="statusDot" class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
          <span id="statusText" class="text-slate-400">Connecting...</span>
        </div>
        <button onclick="logout()" class="text-slate-400 hover:text-rose-400 transition">ออกจากระบบ</button>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-6 space-y-6">

    <!-- User Profile Bar -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center font-bold text-white shadow-md">
          <span id="avatarLetter">P</span>
        </div>
        <div>
          <!-- ชื่อร้านค้า (หลัก) -->
          <div class="font-bold text-white text-base" id="displayStoreName">กำลังโหลด...</div>
          <!-- Username + Unique Key ID (ใต้ชื่อร้าน) -->
          <div class="flex items-center space-x-2 text-xs text-slate-400 mt-0.5">
            <span class="text-slate-300 font-medium" id="displayUsername">@user</span>
            <span class="text-[11px] text-blue-400 font-mono bg-blue-500/10 px-1.5 py-0.2 rounded border border-blue-500/20" id="displayKeyTag">#----</span>
          </div>
        </div>
      </div>
      <span class="text-[10px] bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-full font-mono">Verified Node</span>
    </div>

    <!-- Create Post Composer -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
      <textarea id="postText" rows="3" placeholder="มีข่าวยาใหม่ อัปเดตคลัง หรือข้อความถึงเพื่อนร้านยา..." 
        class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 resize-none transition"></textarea>
      
      <div class="mt-3 flex items-center justify-between border-t border-slate-800/80 pt-3">
        <span class="text-xs text-slate-500">🔒 เซ็นชื่อด้วย ECDSA KeyPair ประจำเครื่อง</span>
        <button id="postBtn" onclick="createPost()" disabled
          class="px-5 py-2 bg-blue-600 hover:bg-blue-500 disabled:bg-slate-800 text-white font-semibold text-xs rounded-xl shadow-lg shadow-blue-600/20 transition cursor-pointer disabled:cursor-not-allowed">
          โพสต์ข้อความ
        </button>
      </div>
    </div>

    <!-- Timeline Feed Header -->
    <div class="flex items-center justify-between border-b border-slate-800 pb-2">
      <h2 class="text-sm font-semibold text-slate-400">ฟีดสาธารณะ (Real-time Sync)</h2>
      <span id="postCount" class="text-xs text-slate-500">0 โพสต์</span>
    </div>

    <!-- Posts Container -->
    <div id="postsFeed" class="space-y-4">
      <div id="loadingFeed" class="text-center py-10 text-slate-500 text-xs">
        กำลังโหลดและซิงค์ข้อมูล CRDT...
      </div>
    </div>

  </main>

  <!-- ES Modules -->
  <script type="module">
    import * as Y from 'https://esm.sh/yjs@13.6.8';
    import { WebsocketProvider } from 'https://esm.sh/y-websocket@1.5.4';

    const RELAY_WS_URL = 'wss://zybook.kaminpos.xyz';
    const ROOM_NAME = 'pharmacy-public-feed';

    let ydoc = null;
    let wsProvider = null;
    let yPostsArray = null;
    let privateKeyObj = null;
    let myKeyTag = '----';

    // ตรวจสอบการเข้าสู่ระบบ & ดึงข้อมูล
    const storeName = sessionStorage.getItem('active_store_name') || 'ร้านยาชุมชน';
    const username = sessionStorage.getItem('active_username') || 'admin';

    if (!sessionStorage.getItem('is_authenticated')) {
      window.location.href = 'zybook_login.html';
    }

    window.addEventListener('DOMContentLoaded', async () => {
      // 1. โหลด Key และดึง Key Tag สั้นๆ ประจำเครื่อง
      await loadCryptoIdentity();

      // 2. แสดงชื่อร้าน และ Username คู่กับ Unique Key Tag
      document.getElementById('displayStoreName').textContent = storeName;
      document.getElementById('displayUsername').textContent = `@${username}`;
      document.getElementById('displayKeyTag').textContent = `#${myKeyTag}`;
      document.getElementById('avatarLetter').textContent = storeName.charAt(0).toUpperCase();

      // 3. เริ่มเชื่อมต่อ Yjs
      initYjsFeed();
    });

    // ดึง Key และสร้าง Unique Tag
    async function loadCryptoIdentity() {
      try {
        const privJwk = JSON.parse(localStorage.getItem('pharmacy_priv_key'));
        const pubJwk = JSON.parse(localStorage.getItem('pharmacy_pub_key'));

        if (privJwk) {
          privateKeyObj = await window.crypto.subtle.importKey(
            "jwk", privJwk,
            { name: "ECDSA", namedCurve: "P-256" },
            false, ["sign"]
          );
        }
        if (pubJwk && pubJwk.x) {
          myKeyTag = pubJwk.x.substring(0, 4);
        }
      } catch (err) {
        console.error("Error importing key:", err);
      }
    }

    // เชื่อมต่อ Yjs & Sync Feed
    function initYjsFeed() {
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const postBtn = document.getElementById('postBtn');

      ydoc = new Y.Doc();
      wsProvider = new WebsocketProvider(RELAY_WS_URL, ROOM_NAME, ydoc);
      
      yPostsArray = ydoc.getArray('posts');

      wsProvider.on('status', event => {
        if (event.status === 'connected') {
          statusDot.className = 'w-2 h-2 rounded-full bg-emerald-500 shadow-sm shadow-emerald-500';
          statusText.textContent = 'Online';
          statusText.className = 'text-emerald-400 font-medium';
          postBtn.disabled = false;
        } else {
          statusDot.className = 'w-2 h-2 rounded-full bg-rose-500';
          statusText.textContent = 'Offline';
          statusText.className = 'text-rose-400 font-medium';
          postBtn.disabled = true;
        }
      });

      yPostsArray.observe(() => {
        renderFeed();
      });

      renderFeed();
    }

    // สร้างโพสต์ใหม่
    window.createPost = async function() {
      const textarea = document.getElementById('postText');
      const text = textarea.value.trim();

      if (!text) return;

      const postId = crypto.randomUUID();
      const timestamp = Date.now();
      const pubJwk = JSON.parse(localStorage.getItem('pharmacy_pub_key'));

      const payloadString = JSON.stringify({ id: postId, storeName, username, keyTag: myKeyTag, text, ts: timestamp });
      
      let signatureBase64 = "";
      if (privateKeyObj) {
        const sigBuffer = await window.crypto.subtle.sign(
          { name: "ECDSA", hash: { name: "SHA-256" } },
          privateKeyObj,
          new TextEncoder().encode(payloadString)
        );
        signatureBase64 = btoa(String.fromCharCode(...new Uint8Array(sigBuffer)));
      }

      const postMap = new Y.Map();
      postMap.set('id', postId);
      postMap.set('storeName', storeName);
      postMap.set('username', username);
      postMap.set('keyTag', myKeyTag);
      postMap.set('text', text);
      postMap.set('ts', timestamp);
      postMap.set('publicKey', pubJwk);
      postMap.set('signature', signatureBase64);

      yPostsArray.push([postMap]);

      textarea.value = '';
    }

    // Render Posts
    function renderFeed() {
      const container = document.getElementById('postsFeed');
      const posts = yPostsArray.toArray();

      document.getElementById('postCount').textContent = `${posts.length} โพสต์`;

      if (posts.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 bg-slate-900/50 rounded-2xl border border-slate-800/60 text-slate-500 text-xs">
            ยังไม่มีโพสต์ในระบบ เป็นคนแรกที่โพสต์ข้อความ!
          </div>`;
        return;
      }

      const sortedPosts = [...posts].sort((a, b) => b.get('ts') - a.get('ts'));

      container.innerHTML = sortedPosts.map(post => {
        const pStoreName = post.get('storeName') || 'ร้านยาทั่วไป';
        const pUsername = post.get('username') || 'admin';
        const pKeyTag = post.get('keyTag') || (post.get('publicKey')?.x ? post.get('publicKey').x.substring(0, 4) : '????');
        const pText = post.get('text') || '';
        const pTs = new Date(post.get('ts')).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
        const pDate = new Date(post.get('ts')).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
        const letter = pStoreName.charAt(0).toUpperCase();

        return `
          <article class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-md transition hover:border-slate-700">
            <div class="flex items-start justify-between mb-2">
              <div class="flex items-center space-x-3">
                <!-- Avatar Icon -->
                <div class="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-sm text-blue-400 shrink-0">
                  ${letter}
                </div>
                
                <div>
                  <!-- ชื่อร้านค้า (ตัวหนา เด่นชัด) -->
                  <div class="font-bold text-sm text-slate-100">${escapeHtml(pStoreName)}</div>
                  
                  <!-- Username + Unique Key ID + เวลาโพสต์ (บรรทัดใต้ชื่อร้าน) -->
                  <div class="flex items-center space-x-1.5 text-xs text-slate-400 mt-0.5">
                    <span class="text-slate-400 font-medium">@${escapeHtml(pUsername)}</span>
                    <span class="text-[10px] text-blue-400 font-mono bg-blue-500/10 px-1.5 py-0.2 rounded border border-blue-500/20">#${pKeyTag}</span>
                    <span class="text-slate-600">•</span>
                    <span class="text-[11px] text-slate-500">${pDate} ${pTs}</span>
                  </div>
                </div>
              </div>

              <!-- Badge ยืนยัน Key -->
              <span class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-full font-mono shrink-0">
                ✓ Verified
              </span>
            </div>
            
            <!-- ข้อความโพสต์ -->
            <p class="text-sm text-slate-300 my-3 whitespace-pre-line leading-relaxed pl-12">${escapeHtml(pText)}</p>

            <div class="flex items-center justify-between pt-2 border-t border-slate-800/60 text-xs text-slate-500 pl-12">
              <button class="flex items-center space-x-1.5 hover:text-rose-400 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                </svg>
                <span>ถูกใจ</span>
              </button>
              <span class="text-[10px] text-slate-600 font-mono">CRDT Signed Item</span>
            </div>
          </article>
        `;
      }).join('');
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    window.logout = function() {
      sessionStorage.clear();
      window.location.href = 'zybook_login.html';
    }
  </script>
</body>
</html>
