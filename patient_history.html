<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ประวัติการรับบริการและประวัติยา - LittleKaminPOS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="bg-light">
<div class="container my-4" style="max-width: 600px;">
  <!-- Status Card -->
  <div class="card shadow-sm mb-3">
    <div class="card-header bg-primary text-white text-center fw-bold fs-5">
      🏥 ประวัติการรับยา / Patient History
    </div>
    <div class="card-body">
      <div id="connectionStatus" class="alert alert-warning text-center py-2 mb-3">
        ⏳ กำลังเชื่อมต่อไปยังระบบคลังยาของร้าน...
      </div>

      <!-- Patient Info -->
      <div id="patientProfile" class="d-none">
        <div class="border-bottom pb-2 mb-3">
          <h5 class="fw-bold text-success" id="pName">-</h5>
          <div class="row text-muted small">
            <div class="col-6">อายุ: <span id="pAge" class="fw-bold text-dark">-</span> ปี</div>
            <div class="col-6">น้ำหนัก: <span id="pWeight" class="fw-bold text-dark">-</span> kg</div>
            <div class="col-12 mt-1">รหัสคนไข้: <span id="pCode" class="fw-bold text-dark">-</span></div>
          </div>
        </div>

        <h6 class="fw-bold mb-2">📜 ประวัติการซื้อยาล่าสุด</h6>
        <div id="billHistoryList"></div>
      </div>
    </div>
  </div>

  <div class="text-center text-muted small">
    ระบบประวัติยาคนไข้แบบจัดเก็บในอุปกรณ์ (Local-First P2P)
  </div>
</div>

<script>
let peer = null;

window.onload = () => {
  // ดึง Param จาก URL ที่สแกนได้จาก QR Code
  const urlParams = new URLSearchParams(window.location.search);
  const hostId = urlParams.get("hostId");
  const patientId = urlParams.get("patientId");

  if (!hostId || !patientId) {
    document.getElementById("connectionStatus").className = "alert alert-danger text-center py-2";
    document.getElementById("connectionStatus").innerText = "❌ QR Code ไม่ถูกต้อง หรือข้อมูลไม่ครบถ้วน";
    return;
  }

  // เริ่มต้นเชื่อมต่อ WebRTC ไปยังเครื่องร้านยา (Host) โดยไม่ต้องเข้าสู่ระบบ
  connectToHostStore(hostId, patientId);
};

function connectToHostStore(hostId, patientId) {
  peer = new Peer({
    config: {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" },
        { urls: "stun:stun2.l.google.com:19302" }
      ]
    }
  });

  peer.on("open", () => {
    const conn = peer.connect(hostId, { reliable: true });

    conn.on("open", () => {
      document.getElementById("connectionStatus").className = "alert alert-info text-center py-2";
      document.getElementById("connectionStatus").innerText = "🔄 เชื่อมต่อร้านยาสำเร็จ กำลังดึงประวัติยา...";

      // ส่งคำขอขอดึงข้อมูลประวัติเฉพาะคนไข้รายนี้
      conn.send({
        type: "REQUEST_PATIENT_HISTORY",
        patientSpecialId: patientId
      });
    });

    conn.on("data", (data) => {
      if (data.type === "RESPONSE_PATIENT_HISTORY") {
        renderPatientData(data.payload);
      }
    });

    conn.on("close", () => {
      console.log("Connection closed");
    });

    conn.on("error", (err) => {
      showError("ไม่สามารถดึงข้อมูลได้ เครื่องร้านยาอาจปิดอยู่");
    });
  });

  peer.on("error", (err) => {
    showError("การเชื่อมต่อ P2P ขัดข้อง กรุณาลองสแกนใหม่อีกครั้ง");
  });
}

function renderPatientData(payload) {
  const { patient, bills } = payload;
  const statusEl = document.getElementById("connectionStatus");

  if (!patient && (!bills || bills.length === 0)) {
    statusEl.className = "alert alert-warning text-center py-2";
    statusEl.innerText = "⚠️ ไม่พบประวัติการรับยาของรหัสคนไข้นี้";
    return;
  }

  statusEl.className = "alert alert-success text-center py-2";
  statusEl.innerText = "✅ ดึงข้อมูลประวัติยาเรียบร้อยแล้ว";

  // แสดงข้อมูลส่วนตัวคนไข้
  document.getElementById("patientProfile").classList.remove("d-none");
  document.getElementById("pName").innerText = patient ? patient.full_name : "คนไข้ทั่วไป";
  document.getElementById("pAge").innerText = patient ? (patient.age || "-") : "-";
  document.getElementById("pWeight").innerText = patient ? (patient.weight || "-") : "-";
  document.getElementById("pCode").innerText = patient ? patient.patient_special_id : "-";

  // แสดงรายการบิล/ยาที่เคยได้รับ (ไม่แสดงราคา)
  const listEl = document.getElementById("billHistoryList");
  listEl.innerHTML = "";

  if (!bills || bills.length === 0) {
    listEl.innerHTML = `<div class="text-center text-muted py-3">ยังไม่มีประวัติการซื้อยา</div>`;
    return;
  }

  // เรียงจากบิลล่าสุดขึ้นก่อน
  bills.reverse().forEach((bill) => {
    const dateStr = bill.timestamp ? new Date(bill.timestamp).toLocaleString("th-TH") : "ไม่ระบุวันที่";

    let itemsHtml = "";
    if (bill.items && bill.items.length > 0) {
      bill.items.forEach((item) => {
        itemsHtml += `
          <li class="list-group-item d-flex justify-content-between align-items-center py-1 fs-6">
            <div>
              <strong>${item.name}</strong>
              <small class="text-muted">x${item.qty}</small>
            </div>
          </li>`;
      });
    }

    let articlesHtml = "";
    if (bill.articles && bill.articles.length > 0) {
      articlesHtml = `<div class="p-2 border-top bg-white">` + bill.articles.map((art) => {
        const contentId = `art-content-${bill.id}-${art.id}`;
        return `
          <div class="mb-2">
            <div class="fw-bold small text-success">📖 ${escapeHtml(art.topic)}</div>
            <div class="text-muted small">${escapeHtml(art.summary || "")}</div>
            <button class="btn btn-sm btn-outline-success mt-1 py-0" onclick="toggleArticle('${contentId}', this)">อ่านเนื้อหาเต็ม</button>
            <div id="${contentId}" class="d-none border-start ps-2 mt-2 small" style="border-color:#198754 !important;">
              ${formatArticleContent(art.content || "")}
            </div>
          </div>`;
      }).join("") + `</div>`;
    }

    listEl.innerHTML += `
      <div class="card mb-2 border">
        <div class="card-header bg-light py-2">
          <small class="fw-bold text-primary">🗓️ ${dateStr}</small>
        </div>
        <ul class="list-group list-group-flush">
          ${itemsHtml}
        </ul>
        ${articlesHtml}
      </div>
    `;
  });
}

// แปลง **ตัวหนา**, *ตัวเอียง* และ [ข้อความ](url) เป็น HTML อย่างปลอดภัย (escape ก่อนเสมอ)
function escapeHtml(str) {
  const div = document.createElement("div");
  div.innerText = str == null ? "" : str;
  return div.innerHTML;
}

function formatArticleContent(raw) {
  let safe = escapeHtml(raw);
  safe = safe.replace(/\n/g, "<br>");
  safe = safe.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  safe = safe.replace(/\*(.+?)\*/g, "<em>$1</em>");
  safe = safe.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return safe;
}

function toggleArticle(contentId, btn) {
  const el = document.getElementById(contentId);
  if (!el) return;
  const isHidden = el.classList.contains("d-none");
  el.classList.toggle("d-none");
  btn.innerText = isHidden ? "ซ่อนเนื้อหา" : "อ่านเนื้อหาเต็ม";
}

function showError(msg) {
  const statusEl = document.getElementById("connectionStatus");
  statusEl.className = "alert alert-danger text-center py-2";
  statusEl.innerText = "❌ " + msg;
}
</script>
</body>
</html>
