<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ประวัติการรับบริการและประวัติยา - LittleKaminPOS</title>

  <!-- Auth Guard: ต้องอยู่บนสุดของ <head> ก่อนสคริปต์/สไตล์อื่นใด
       เพื่อสกัดผู้ที่เข้าถึง html ตรงๆ โดยยังไม่ผ่าน zybook_login.html
       (ป้องกันทั้งการ render เนื้อหาก่อน redirect และการรันโค้ดอื่นๆ ที่ไม่ควรทำงาน) -->
  <script>
    if (sessionStorage.getItem('is_authenticated') !== 'true') {
      window.location.replace('login.html');
      // โยน error เพื่อหยุดการรันสคริปต์ที่เหลือใน head ทันที กัน race condition
      // ระหว่างกำลัง redirect กับสคริปต์ตัวถัดไปที่โหลด/ทำงานต่อ
      throw new Error('Not authenticated — redirecting to login');
    }
  </script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="bg-light">
<div class="container my-4" style="max-width: 600px;">
  <!-- Status Card -->
  <div class="card shadow-sm mb-3">
    <div class="card-header bg-primary text-white text-center fw-bold fs-5">
      🏥 ประวัติการรับยา / Patient History
    </div>
    <div class="card-body">
      <div id="connectionStatus" class="alert alert-warning text-center py-2 mb-3">
        ⏳ กำลังเชื่อมต่อไปยังระบบคลังยาของร้าน...
      </div>

      <!-- Pharmacy Status Banner -->
      <div id="pharmacyStatus" class="alert text-center py-2 mb-3 d-none fw-bold"></div>

      <!-- Patient Info -->
      <div id="patientProfile" class="d-none">
        <div class="border-bottom pb-2 mb-3">
          <div class="d-flex justify-content-between align-items-start">
            <h5 class="fw-bold text-success" id="pName">-</h5>
            <button class="btn btn-sm btn-outline-primary" onclick="toggleEditPatientForm()" id="editPatientToggleBtn">✏️ แก้ไขข้อมูล</button>
          </div>
          <div class="row text-muted small">
            <div class="col-6">อายุ: <span id="pAge" class="fw-bold text-dark">-</span> ปี</div>
            <div class="col-6">น้ำหนัก: <span id="pWeight" class="fw-bold text-dark">-</span> kg</div>
            <div class="col-12 mt-1">รหัสคนไข้: <span id="pCode" class="fw-bold text-dark">-</span></div>
            <div class="col-12 mt-1">เบอร์โทร: <span id="pPhone" class="fw-bold text-dark">-</span></div>
          </div>

          <!-- ฟอร์มแก้ไขข้อมูล -->
          <form id="editPatientForm" class="d-none mt-3 p-2 border rounded bg-light">
            <div class="mb-2">
              <label class="form-label small mb-1">ชื่อ-นามสกุล</label>
              <input type="text" id="editPName" class="form-control form-control-sm" required>
            </div>
            <div class="row g-2 mb-2">
              <div class="col-6">
                <label class="form-label small mb-1">อายุ (ปี)</label>
                <input type="number" step="0.1" id="editPAge" class="form-control form-control-sm">
              </div>
              <div class="col-6">
                <label class="form-label small mb-1">น้ำหนัก (kg)</label>
                <input type="number" step="0.1" id="editPWeight" class="form-control form-control-sm">
              </div>
            </div>
            <div class="mb-2">
              <label class="form-label small mb-1">เบอร์โทรศัพท์</label>
              <input type="tel" id="editPPhone" class="form-control form-control-sm">
            </div>
            <div id="editPatientMsg" class="small mb-2"></div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-sm btn-success w-100" id="editPatientSaveBtn">📨 ส่งคำขอแก้ไข</button>
              <button type="button" class="btn btn-sm btn-outline-secondary w-100" onclick="toggleEditPatientForm(false)">ยกเลิก</button>
            </div>
          </form>
        </div>

        <h6 class="fw-bold mb-2">📜 ประวัติการซื้อยาล่าสุด</h6>
        <div id="billHistoryList"></div>
      </div>
    </div>
  </div>

  <div class="text-center text-muted small">
    ระบบประวัติยาคนไข้แบบจัดเก็บในอุปกรณ์ (Local-First P2P)
  </div>
</div>

<!-- ===== ปุ่มแชท (ลอยมุมขวาล่าง) ===== -->
<button id="openChatBtn" class="btn btn-primary rounded-circle shadow d-none"
  style="position:fixed;bottom:24px;right:24px;width:60px;height:60px;font-size:22px;z-index:1000;">
  💬
</button>
<span id="chatBadge" class="badge bg-danger rounded-pill d-none"
  style="position:fixed;bottom:70px;right:20px;z-index:1001;">0</span>

<!-- ===== แผงแชท ===== -->
<div id="chatPanel" class="card shadow d-none"
  style="position:fixed;bottom:24px;right:24px;width:320px;max-height:70vh;z-index:1002;display:flex;flex-direction:column;">
  <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-2">
    <span class="fw-bold small">💬 แชทกับร้านยา</span>
    <button id="closeChatBtn" class="btn-close btn-close-white" style="font-size:12px;"></button>
  </div>
  <div id="chatMessages" class="p-2 flex-grow-1" style="overflow-y:auto;height:280px;background:#f8f9fa;"></div>
  <form id="chatForm" class="d-flex gap-1 p-2 border-top bg-white">
    <input id="chatInput" type="text" class="form-control form-control-sm" placeholder="พิมพ์ข้อความ..." autocomplete="off" disabled>
    <button type="submit" class="btn btn-primary btn-sm" disabled id="chatSendBtn">ส่ง</button>
  </form>
</div>

<script>
let peer = null;
let conn = null; // เก็บ reference ไว้ใช้ร่วมกันทั้งดึงประวัติและแชท
let unreadCount = 0;
let chatOpen = false;
let currentPatientId = null;
let currentPatientData = null;

window.onload = () => {
  // ดึง Param จาก URL ที่สแกนได้จาก QR Code
  const urlParams = new URLSearchParams(window.location.search);
  const hostId = urlParams.get("hostId");
  const patientId = urlParams.get("patientId");
  currentPatientId = patientId;

  if (!hostId || !patientId) {
    document.getElementById("connectionStatus").className = "alert alert-danger text-center py-2";
    document.getElementById("connectionStatus").innerText = "❌ QR Code ไม่ถูกต้อง หรือข้อมูลไม่ครบถ้วน";
    return;
  }

  // เริ่มต้นเชื่อมต่อ WebRTC ไปยังเครื่องร้านยา (Host) โดยไม่ต้องเข้าสู่ระบบ
  connectToHostStore(hostId, patientId);

  setupChatUI();
};

function connectToHostStore(hostId, patientId) {
  peer = new Peer({
    config: {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" },
        { urls: "stun:stun2.l.google.com:19302" }
      ]
    }
  });

  peer.on("open", () => {
    conn = peer.connect(hostId, { reliable: true });

    conn.on("open", () => {
      document.getElementById("connectionStatus").className = "alert alert-info text-center py-2";
      document.getElementById("connectionStatus").innerText = "🔄 เชื่อมต่อร้านยาสำเร็จ กำลังดึงประวัติยา...";

      // ส่งคำขอขอดึงข้อมูลประวัติเฉพาะคนไข้รายนี้
      conn.send({
        type: "REQUEST_PATIENT_HISTORY",
        patientSpecialId: patientId
      });

      // การเชื่อมต่อพร้อมใช้งานแล้ว เปิดปุ่มแชทได้
      enableChat();
    });

    conn.on("data", (data) => {
      if (data.type === "RESPONSE_PATIENT_HISTORY") {
        renderPatientData(data.payload);
      } else if (data.type === "CHAT_MESSAGE") {
        addChatMessage(data.payload, false);
      } else if (data.type === "STATUS_UPDATE") {
        renderPharmacyStatus(data.payload);
      } else if (data.type === "BLOCKED") {
        showError(data.payload && data.payload.reason ? data.payload.reason : "การเชื่อมต่อถูกระงับโดยร้านยา");
        disableChat();
      } else if (data.type === "PATIENT_INFO_UPDATED") {
        onPatientInfoUpdated(data.payload);
      } else if (data.type === "PATIENT_INFO_UPDATE_FAILED") {
        showEditPatientMsg(data.payload && data.payload.reason ? data.payload.reason : "แก้ไขข้อมูลไม่สำเร็จ", true);
      } else if (data.type === "PATIENT_INFO_UPDATE_REQUESTED") {
        showEditPatientMsg("📨 ส่งคำขอแก้ไขข้อมูลแล้ว รอร้านยาตรวจสอบและอนุมัติ", false);
      } else if (data.type === "PATIENT_INFO_UPDATE_APPROVED") {
        onPatientInfoUpdated(data.payload);
      } else if (data.type === "PATIENT_INFO_UPDATE_REJECTED") {
        showEditPatientMsg("❌ ร้านยาไม่อนุมัติคำขอแก้ไขข้อมูลนี้" + (data.payload && data.payload.reason ? (": " + data.payload.reason) : ""), true);
      }
    });

    conn.on("close", () => {
      console.log("Connection closed");
      disableChat();
    });

    conn.on("error", (err) => {
      showError("ไม่สามารถดึงข้อมูลได้ เครื่องร้านยาอาจปิดอยู่");
    });
  });

  peer.on("error", (err) => {
    showError("การเชื่อมต่อ P2P ขัดข้อง กรุณาลองสแกนใหม่อีกครั้ง");
  });
}

/* ================== CHAT ================== */

function setupChatUI() {
  const openBtn = document.getElementById("openChatBtn");
  const closeBtn = document.getElementById("closeChatBtn");
  const panel = document.getElementById("chatPanel");
  const form = document.getElementById("chatForm");
  const input = document.getElementById("chatInput");

  openBtn.addEventListener("click", () => {
    chatOpen = true;
    panel.classList.remove("d-none");
    openBtn.classList.add("d-none");
    clearBadge();
    input.focus();
  });

  closeBtn.addEventListener("click", () => {
    chatOpen = false;
    panel.classList.add("d-none");
    openBtn.classList.remove("d-none");
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || !conn || !conn.open) return;

    const payload = { sender: "patient", text, ts: Date.now() };
    conn.send({ type: "CHAT_MESSAGE", payload });
    addChatMessage(payload, true);
    input.value = "";
  });
}

function enableChat() {
  document.getElementById("openChatBtn").classList.remove("d-none");
  document.getElementById("chatInput").disabled = false;
  document.getElementById("chatSendBtn").disabled = false;
}

function disableChat() {
  document.getElementById("openChatBtn").classList.add("d-none");
  document.getElementById("chatPanel").classList.add("d-none");
  document.getElementById("chatInput").disabled = true;
  document.getElementById("chatSendBtn").disabled = true;
}

function addChatMessage(payload, isMe) {
  const el = document.getElementById("chatMessages");
  const div = document.createElement("div");
  div.className = "mb-2 d-flex " + (isMe ? "justify-content-end" : "justify-content-start");

  const bubble = document.createElement("div");
  bubble.className = "px-2 py-1 rounded small " + (isMe ? "bg-primary text-white" : "bg-white border");
  bubble.style.maxWidth = "80%";
  bubble.innerText = payload.text; // ใช้ innerText กัน XSS

  const wrap = document.createElement("div");
  wrap.appendChild(bubble);
  const time = document.createElement("div");
  time.className = "text-muted text-end small";
  time.style.fontSize = "10px";
  time.innerText = new Date(payload.ts).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" });
  wrap.appendChild(time);

  div.appendChild(wrap);
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;

  if (!isMe && !chatOpen) bumpBadge();
}

function bumpBadge() {
  unreadCount++;
  const badge = document.getElementById("chatBadge");
  badge.innerText = unreadCount;
  badge.classList.remove("d-none");
}

function clearBadge() {
  unreadCount = 0;
  document.getElementById("chatBadge").classList.add("d-none");
}

function renderPharmacyStatus(status) {
  const el = document.getElementById("pharmacyStatus");
  el.classList.remove("d-none");

  const map = {
    available: { text: "🟢 ร้านยาว่าง สามารถเข้ารับบริการได้เลย", cls: "alert-success" },
    busy:      { text: "🔴 ร้านยาไม่ว่างในขณะนี้", cls: "alert-danger" },
    queue:     { text: `🟡 มีคิวรออยู่${status.queueCount ? " " + status.queueCount + " คิว" : ""}`, cls: "alert-warning" }
  };

  const info = map[status.state] || { text: "ไม่ทราบสถานะร้าน", cls: "alert-secondary" };
  el.className = "alert text-center py-2 mb-3 fw-bold " + info.cls;
  el.innerText = info.text;
}

/* ============== (โค้ดเดิม: แสดงประวัติยา) ============== */

function renderPatientData(payload) {
  const { patient, bills } = payload;
  const statusEl = document.getElementById("connectionStatus");

  if (!patient && (!bills || bills.length === 0)) {
    statusEl.className = "alert alert-warning text-center py-2";
    statusEl.innerText = "⚠️ ไม่พบประวัติการรับยาของรหัสคนไข้นี้";
    return;
  }

  statusEl.className = "alert alert-success text-center py-2";
  statusEl.innerText = "✅ ดึงข้อมูลประวัติยาเรียบร้อยแล้ว";

  // แสดงข้อมูลส่วนตัวคนไข้
  document.getElementById("patientProfile").classList.remove("d-none");
  document.getElementById("pName").innerText = patient ? patient.full_name : "คนไข้ทั่วไป";
  document.getElementById("pAge").innerText = patient ? (patient.age || "-") : "-";
  document.getElementById("pWeight").innerText = patient ? (patient.weight || "-") : "-";
  document.getElementById("pCode").innerText = patient ? patient.patient_special_id : "-";
  document.getElementById("pPhone").innerText = patient ? (patient.phone || "-") : "-";
  currentPatientData = patient || null;

  // แสดงรายการบิล/ยาที่เคยได้รับ (ไม่แสดงราคา)
  const listEl = document.getElementById("billHistoryList");
  listEl.innerHTML = "";

  if (!bills || bills.length === 0) {
    listEl.innerHTML = `<div class="text-center text-muted py-3">ยังไม่มีประวัติการซื้อยา</div>`;
    return;
  }

  // เรียงจากบิลล่าสุดขึ้นก่อน
  bills.reverse().forEach((bill) => {
    const dateStr = bill.timestamp ? new Date(bill.timestamp).toLocaleString("th-TH") : "ไม่ระบุวันที่";

    let itemsHtml = "";
    if (bill.items && bill.items.length > 0) {
      bill.items.forEach((item) => {
        itemsHtml += `
          <li class="list-group-item d-flex justify-content-between align-items-center py-1 fs-6">
            <div>
              <strong>${item.name}</strong>
              <small class="text-muted">x${item.qty}</small>
            </div>
          </li>`;
      });
    }

    let articlesHtml = "";
    if (bill.articles && bill.articles.length > 0) {
      articlesHtml = `<div class="p-2 border-top bg-white">` + bill.articles.map((art) => {
        const contentId = `art-content-${bill.id}-${art.id}`;
        return `
          <div class="mb-2">
            <div class="fw-bold small text-success">📖 ${escapeHtml(art.topic)}</div>
            <div class="text-muted small">${escapeHtml(art.summary || "")}</div>
            <button class="btn btn-sm btn-outline-success mt-1 py-0" onclick="toggleArticle('${contentId}', this)">อ่านเนื้อหาเต็ม</button>
            <div id="${contentId}" class="d-none border-start ps-2 mt-2 small" style="border-color:#198754 !important;">
              ${formatArticleContent(art.content || "")}
            </div>
          </div>`;
      }).join("") + `</div>`;
    }

    listEl.innerHTML += `
      <div class="card mb-2 border">
        <div class="card-header bg-light py-2">
          <small class="fw-bold text-primary">🗓️ ${dateStr}</small>
        </div>
        <ul class="list-group list-group-flush">
          ${itemsHtml}
        </ul>
        ${articlesHtml}
      </div>
    `;
  });
}

// แปลง **ตัวหนา**, *ตัวเอียง* และ [ข้อความ](url) เป็น HTML อย่างปลอดภัย (escape ก่อนเสมอ)
function escapeHtml(str) {
  const div = document.createElement("div");
  div.innerText = str == null ? "" : str;
  return div.innerHTML;
}

function formatArticleContent(raw) {
  let safe = escapeHtml(raw);
  safe = safe.replace(/\n/g, "<br>");
  safe = safe.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  safe = safe.replace(/\*(.+?)\*/g, "<em>$1</em>");
  safe = safe.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return safe;
}

function toggleArticle(contentId, btn) {
  const el = document.getElementById(contentId);
  if (!el) return;
  const isHidden = el.classList.contains("d-none");
  el.classList.toggle("d-none");
  btn.innerText = isHidden ? "ซ่อนเนื้อหา" : "อ่านเนื้อหาเต็ม";
}

function toggleEditPatientForm(show) {
  const form = document.getElementById("editPatientForm");
  const shouldShow = show === undefined ? form.classList.contains("d-none") : show;

  if (shouldShow) {
    if (!currentPatientData) {
      alert("ไม่พบข้อมูลคนไข้ที่จะแก้ไข");
      return;
    }
    document.getElementById("editPName").value = currentPatientData.full_name || "";
    document.getElementById("editPAge").value = currentPatientData.age || "";
    document.getElementById("editPWeight").value = currentPatientData.weight || "";
    document.getElementById("editPPhone").value = currentPatientData.phone || "";
    document.getElementById("editPatientMsg").innerHTML = "";
    form.classList.remove("d-none");
  } else {
    form.classList.add("d-none");
  }
}

document.getElementById("editPatientForm").addEventListener("submit", function (e) {
  e.preventDefault();

  if (!conn || !conn.open) {
    showEditPatientMsg("ยังไม่ได้เชื่อมต่อกับร้านยา กรุณาลองใหม่อีกครั้ง", true);
    return;
  }

  const payload = {
    full_name: document.getElementById("editPName").value.trim(),
    age: document.getElementById("editPAge").value,
    weight: document.getElementById("editPWeight").value,
    phone: document.getElementById("editPPhone").value.trim()
  };

  if (!payload.full_name) {
    showEditPatientMsg("กรุณากรอกชื่อ-นามสกุล", true);
    return;
  }

  document.getElementById("editPatientSaveBtn").disabled = true;
  document.getElementById("editPatientSaveBtn").innerText = "กำลังส่งคำขอ...";

  conn.send({
    type: "REQUEST_PATIENT_INFO_UPDATE",
    patientSpecialId: currentPatientId,
    payload: payload
  });
});

function onPatientInfoUpdated(updatedPatient) {
  currentPatientData = updatedPatient;

  document.getElementById("pName").innerText = updatedPatient.full_name || "-";
  document.getElementById("pAge").innerText = updatedPatient.age || "-";
  document.getElementById("pWeight").innerText = updatedPatient.weight || "-";
  document.getElementById("pPhone").innerText = updatedPatient.phone || "-";

  showEditPatientMsg("✅ ร้านยาอนุมัติคำขอแล้ว บันทึกข้อมูลเรียบร้อย", false);

  const btn = document.getElementById("editPatientSaveBtn");
  btn.disabled = false;
  btn.innerText = "💾 ส่งคำขอแก้ไข";

  setTimeout(() => toggleEditPatientForm(false), 1500);
}

function showEditPatientMsg(text, isError) {
  const el = document.getElementById("editPatientMsg");
  el.className = "small mb-2 " + (isError ? "text-danger" : "text-success");
  el.innerText = text;

  const btn = document.getElementById("editPatientSaveBtn");
  if (isError) {
    btn.disabled = false;
    btn.innerText = "📨 ส่งคำขอแก้ไข";
  }
}

function showError(msg) {
  const statusEl = document.getElementById("connectionStatus");
  statusEl.className = "alert alert-danger text-center py-2";
  statusEl.innerText = "❌ " + msg;
}
</script>
</body>
</html>
