<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - ร้านยา Local-First</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
  <div class="card mx-auto shadow-sm" style="max-width: 400px; width: 100%;">
    <div class="card-body p-4">
      <h4 class="card-title text-center mb-4">เข้าสู่ระบบร้านยา</h4>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" id="username" class="form-control" placeholder="admin" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="admin" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
    </div>
  </div>

  <script src="db.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      await dbEngine.init();
      const users = await dbEngine.getAll("users");
      const u = document.getElementById("username").value;
      const p = document.getElementById("password").value;

      const valid = users.find(user => user.username === u && user.password === p);
      if (valid) {
        sessionStorage.setItem("loggedInUser", u);
        // พา syncId (ถ้ามี จากการสแกน QR) กลับไปที่ index.html ด้วย
        const urlParams = new URLSearchParams(window.location.search);
        const syncId = urlParams.get("syncId");
        window.location.href = syncId ? `index.html?syncId=${syncId}` : "index.html";
      } else {
        alert("Username หรือ Password ไม่ถูกต้อง!");
      }
    });
  </script>
</body>
</html>
